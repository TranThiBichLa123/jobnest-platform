name: JobNest CI

on:
  push:
    branches: [ main, master, develop, "**" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check backend structure
        run: |
          test -d backend
          test -f backend/pom.xml
          echo "Backend structure OK"

      - name: Run backend Maven verification
        working-directory: backend
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B -DskipTests clean package
          else
            mvn -B -DskipTests clean package
          fi

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend structure
        run: |
          test -d frontend
          test -f frontend/package.json
          echo "Frontend structure OK"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Run frontend lint if available
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run frontend build if available
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
          CI: false
        run: npm run build --if-present